name: Advanced Marketing & Website Promotion Engine

on:
  schedule:
    # Run DAILY at 14:00 UTC (10:00 AM EST)
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote-website-and-socials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests

      - name: Generate Social Media Post Drafts
        run: |
          python3 _marketing/generate_instagram_posts.py

      - name: Rebuild Blog & RSS Feed
        run: |
          python3 _marketing/generate_blog.py
          python3 _marketing/generate_rss.py

      - name: Generate Pinterest Pin Drafts
        run: |
          python3 _marketing/generate_pinterest_pins.py

      - name: Ping Search Engine Indexing Endpoints
        run: |
          curl -s "https://www.bing.com/ping?sitemap=https://sporlyworks.com/sitemap.xml" || true

      - name: Commit and Push Promotion Assets
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff-index --quiet HEAD || git commit -m "chore(marketing): generate social promo drafts and update RSS syndication"
          git push origin main
