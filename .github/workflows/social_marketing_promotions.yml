name: Advanced Marketing & Website Promotion Engine

on:
  schedule:
    # Run DAILY at 14:00 UTC (10:00 AM EST)
    - cron: '0 14 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  promote-website-and-socials:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests

      - name: Generate Social Media Post Drafts & Avatars
        run: |
          python3 _marketing/generate_instagram_avatar.py
          python3 _marketing/generate_instagram_posts.py

      - name: Auto-Post to Instagram (If Credentials Configured)
        env:
          INSTAGRAM_USER: ${{ secrets.INSTAGRAM_USER }}
          INSTAGRAM_PASS: ${{ secrets.INSTAGRAM_PASS }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: |
          if [ -n "$INSTAGRAM_USER" ] && [ -n "$INSTAGRAM_PASS" ]; then
            python3 _marketing/instagram_autoposter.py --username "$INSTAGRAM_USER" --password "$INSTAGRAM_PASS" || true
          elif [ -n "$INSTAGRAM_ACCESS_TOKEN" ] && [ -n "$INSTAGRAM_ACCOUNT_ID" ]; then
            python3 _marketing/instagram_autoposter.py --access-token "$INSTAGRAM_ACCESS_TOKEN" --account-id "$INSTAGRAM_ACCOUNT_ID" --public-url "https://sporlyworks.com/_marketing/instagram_drafts" || true
          else
            echo "ℹ️ Instagram credentials not set in GitHub Secrets yet. Skipping live auto-post (drafts compiled successfully)."
          fi

      - name: Rebuild Blog & RSS Feed
        run: |
          python3 _marketing/generate_blog.py
          python3 _marketing/generate_rss.py

      - name: Generate Pinterest Pin Drafts
        run: |
          python3 _marketing/generate_pinterest_pins.py

      - name: Ping Search Engine Indexing Endpoints
        run: |
          python3 scripts/ping_indexnow.py --limit 10 || true
          curl -s "https://www.bing.com/ping?sitemap=https://sporlyworks.com/sitemap.xml" || true

      - name: Commit and Push Promotion Assets (Clean-Before-Rebase)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(marketing): generate social promo drafts and update RSS syndication"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || {
                echo "Push failed on attempt $attempt, cleaning working tree before retry..."
                git checkout -- . || true
                git clean -fd || true
                sleep 5
              }
            done
          fi
