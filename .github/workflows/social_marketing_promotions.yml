name: Advanced Marketing & Website Promotion Engine

on:
  schedule:
    # Run DAILY at 14:00 UTC (10:00 AM EST)
    - cron: '0 14 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  promote-website-and-socials:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests instagrapi

      - name: Generate Social Media Post Drafts & Avatars
        run: |
          python3 _marketing/generate_instagram_avatar.py
          python3 _marketing/generate_instagram_posts.py

      - name: Auto-Post to Instagram (If Credentials Configured)
        env:
          INSTAGRAM_SESSION_ID: ${{ secrets.INSTAGRAM_SESSION_ID }}
          INSTAGRAM_USER: ${{ secrets.INSTAGRAM_USER }}
          INSTAGRAM_PASS: ${{ secrets.INSTAGRAM_PASS }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: |
          DELETE_FLAG=""
          if [ -f "_marketing/delete_target.txt" ]; then
            TARGET_ID=$(cat _marketing/delete_target.txt | tr -d '[:space:]')
            if [ -n "$TARGET_ID" ]; then
              DELETE_FLAG="--delete-media-id $TARGET_ID"
              echo "🗑️ Detected delete target: $TARGET_ID"
            fi
          fi

          ARGS=""
          if [ -n "$INSTAGRAM_SESSION_ID" ]; then
            ARGS="$ARGS --session-id $INSTAGRAM_SESSION_ID"
          fi
          if [ -n "$INSTAGRAM_USER" ]; then
            ARGS="$ARGS --username $INSTAGRAM_USER"
          fi
          if [ -n "$INSTAGRAM_PASS" ]; then
            ARGS="$ARGS --password $INSTAGRAM_PASS"
          fi
          if [ -n "$INSTAGRAM_ACCESS_TOKEN" ]; then
            ARGS="$ARGS --access-token $INSTAGRAM_ACCESS_TOKEN"
          fi
          if [ -n "$INSTAGRAM_ACCOUNT_ID" ]; then
            ARGS="$ARGS --account-id $INSTAGRAM_ACCOUNT_ID"
          fi

          if [ -n "$ARGS" ]; then
            python3 _marketing/instagram_autoposter.py $ARGS $DELETE_FLAG || true
          else
            echo "ℹ️ Instagram credentials not set in GitHub Secrets yet. Skipping live auto-post (drafts compiled successfully)."
          fi

          # Clean up delete target once executed
          if [ -f "_marketing/delete_target.txt" ]; then
            rm -f _marketing/delete_target.txt
          fi

      - name: Rebuild Blog & RSS Feed
        run: |
          python3 _marketing/generate_blog.py
          python3 _marketing/generate_rss.py

      - name: Generate Pinterest Pin Drafts
        run: |
          python3 _marketing/generate_pinterest_pins.py

      - name: Auto-Post to Pinterest (If Credentials Configured)
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: |
          if [ -n "$PINTEREST_ACCESS_TOKEN" ] && [ -n "$PINTEREST_BOARD_ID" ]; then
            python3 _marketing/pinterest_autoposter.py --access-token "$PINTEREST_ACCESS_TOKEN" --board-id "$PINTEREST_BOARD_ID" || true
          else
            echo "ℹ️ Pinterest credentials not set in GitHub Secrets yet. Skipping live auto-post (drafts compiled successfully)."
          fi

      - name: Execute Automated Tool & Community Syndication
        run: |
          python3 scripts/syndicate_tools_community.py || true

      - name: Ping Search Engine Indexing Endpoints
        run: |
          python3 scripts/ping_indexnow.py --limit 10 || true
          curl -s "https://www.bing.com/ping?sitemap=https://sporlyworks.com/sitemap.xml" || true

      - name: Commit and Push Promotion Assets (Clean-Before-Rebase)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(marketing): generate social promo drafts and update RSS syndication"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || {
                echo "Push failed on attempt $attempt, cleaning working tree before retry..."
                git checkout -- . || true
                git clean -fd || true
                sleep 5
              }
            done
          fi
