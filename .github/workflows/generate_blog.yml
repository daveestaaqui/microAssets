name: Auto Generate Blog Content

on:
  schedule:
    # Run every Monday at 12:00 UTC (8:00 AM EST)
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-blog-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Auto Blog Generator
        run: |
          python3 _marketing/auto_generate_blog_post.py
          python3 _marketing/generate_sitemap.py
          python3 _marketing/generate_rss.py

      - name: Commit and Push New Content
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff-index --quiet HEAD || git commit -m "chore(blog): auto-generate new research article and update sitemap"
          git push origin main
